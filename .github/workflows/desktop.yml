name: Desktop

# Every push to main (a merged PR is one) bumps the app version, tags it, and builds installers for
# Windows, Linux and macOS (Apple silicon and Intel). They are attached, with the signed latest.json
# the in-app updater reads, to a GitHub release named after the tag, which is published once every build has succeeded.
# The bump level comes from the commit messages: see .github/scripts/bump-version.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so two quick pushes never bump the same version.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    # The release commit below is pushed with GITHUB_TOKEN, which does not retrigger workflows; this is a second guard.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: bump
        run: |
          before=${{ github.event.before }}
          version=$(.github/scripts/bump-version.sh "${before:-0000000}" "$GITHUB_SHA")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$version [skip ci]"
          git tag "v$version"
          git push origin HEAD:main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # The builds only upload to this draft; creating it here keeps release creation in one job.
          gh release create "v$version" --draft --title "Seijaku v$version" --notes "" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private half of the updater key (apps/desktop/src-tauri/tauri.conf.json holds the public half).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: "Seijaku ${{ needs.version.outputs.tag }}"
          releaseDraft: true
          args: ${{ matrix.args }}

  # Runs only when all four builds succeeded, so the public release is never partial.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "${{ needs.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
